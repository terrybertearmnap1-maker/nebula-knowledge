[project]
name = "langchain-fastapi-agent"
version = "0.1.0"
description = "A team-scoped knowledge base agent built with LangChain v1 and FastAPI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ddgs>=9,<10",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langchain>=1.2,<2",
    "langchain-openai>=1.1,<2",
    "pydantic-settings>=2.7,<3",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.9",
    "tzdata>=2025.1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
