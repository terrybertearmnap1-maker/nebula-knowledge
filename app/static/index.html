<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b14">
  <title>Nebula Knowledge · 团队知识库 Agent</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237c9cff'/%3E%3Cpath d='M16 5l2.5 6.5L25 14l-6.5 2.5L16 23l-2.5-6.5L7 14l6.5-2.5L16 5z' fill='%230b1020'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b14;
      --panel: rgba(18, 23, 38, 0.82);
      --panel-strong: #111726;
      --border: rgba(148, 163, 184, 0.14);
      --border-strong: rgba(148, 163, 184, 0.24);
      --text: #e8edf7;
      --muted: #8b97ad;
      --faint: #5f6b81;
      --accent: #7c9cff;
      --accent-2: #a78bfa;
      --cyan: #5eead4;
      --user: #1d2740;
      --danger: #fb7185;
      --radius: 20px;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(900px 520px at 12% -10%, rgba(124, 156, 255, 0.16), transparent 60%),
        radial-gradient(700px 500px at 100% 0%, rgba(167, 139, 250, 0.12), transparent 55%),
        radial-gradient(800px 600px at 50% 120%, rgba(94, 234, 212, 0.07), transparent 60%),
        var(--bg);
      font-family: "Segoe UI Variable", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    button, textarea { font: inherit; }
    button { cursor: pointer; }

    .app {
      width: min(1080px, calc(100% - 32px));
      height: calc(100dvh - 32px);
      margin: 16px auto;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 26px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
      overflow: hidden;
      position: relative;
    }

    .app::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
      pointer-events: none;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(10, 14, 24, 0.4);
      flex: 0 0 auto;
      z-index: 2;
    }

    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: linear-gradient(140deg, #7c9cff, #a78bfa 55%, #5eead4);
      box-shadow: 0 8px 24px rgba(124, 156, 255, 0.28);
      flex: 0 0 auto;
      position: relative;
    }

    .logo svg { width: 23px; height: 23px; display: block; }

    .titles { min-width: 0; }
    .titles h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 650;
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .titles p {
      margin: 3px 0 0;
      font-size: 11.5px;
      color: var(--muted);
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 32px;
      padding: 0 11px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--faint);
      box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.1);
      transition: 0.2s ease;
    }
    .status.online .dot { background: var(--cyan); box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.14), 0 0 13px rgba(94, 234, 212, 0.5); }
    .status.offline .dot { background: var(--danger); box-shadow: 0 0 0 3px rgba(251, 113, 133, 0.14); }
    .status .model { color: var(--text); font-weight: 550; max-width: 130px; overflow: hidden; text-overflow: ellipsis; }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 34px;
      padding: 0 12px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 12.5px;
      transition: 0.18s ease;
    }
    .icon-btn:hover { background: rgba(255, 255, 255, 0.09); border-color: var(--border-strong); }
    .icon-btn svg { width: 14px; height: 14px; }

    .demo-banner {
      display: none;
      align-items: center;
      gap: 9px;
      padding: 9px 20px;
      font-size: 12px;
      color: #c7d2fe;
      background: linear-gradient(90deg, rgba(124, 156, 255, 0.12), rgba(167, 139, 250, 0.07));
      border-bottom: 1px solid rgba(124, 156, 255, 0.14);
      flex: 0 0 auto;
    }
    .demo-banner.show { display: flex; }
    .demo-banner strong { color: #e0e7ff; font-weight: 650; }
    .demo-banner .spark { color: var(--accent); }

    .chat {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 26px 24px 12px;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: rgba(148, 163, 184, 0.24) transparent;
    }
    .chat::-webkit-scrollbar { width: 8px; }
    .chat::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.2); border-radius: 8px; }

    .inner { width: min(760px, 100%); margin: 0 auto; }

    .welcome {
      padding: 34px 0 26px;
      text-align: center;
      animation: rise 0.45s ease both;
    }
    .welcome .orb {
      width: 64px; height: 64px; margin: 0 auto 18px;
      border-radius: 22px;
      display: grid; place-items: center;
      background: linear-gradient(145deg, rgba(124,156,255,0.24), rgba(167,139,250,0.12));
      border: 1px solid rgba(124, 156, 255, 0.26);
      box-shadow: 0 16px 50px rgba(124, 156, 255, 0.14), inset 0 1px rgba(255,255,255,0.12);
    }
    .welcome .orb svg { width: 32px; height: 32px; }
    .welcome h2 { margin: 0 0 9px; font-size: clamp(22px, 3.2vw, 29px); letter-spacing: -0.02em; font-weight: 650; }
    .welcome h2 span { background: linear-gradient(100deg, #a9bcff, #c4b5fd 50%, #99f6e4); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .welcome p { margin: 0 auto; max-width: 460px; color: var(--muted); font-size: 13.5px; line-height: 1.7; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
      margin-top: 24px;
    }
    .suggestion {
      padding: 9px 13px;
      border-radius: 11px;
      color: #c7d2e5;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid var(--border);
      font-size: 12.5px;
      transition: 0.18s ease;
    }
    .suggestion:hover { color: #fff; border-color: rgba(124, 156, 255, 0.4); background: rgba(124, 156, 255, 0.1); transform: translateY(-1px); }
    .suggestion span { color: var(--accent); margin-right: 5px; }
    .welcome-kb-link { display: block; width: fit-content; margin: 12px auto 0; color: var(--cyan); border-color: rgba(94, 234, 212, 0.2); background: rgba(94, 234, 212, 0.05); }

    .message {
      display: flex;
      gap: 11px;
      margin-bottom: 20px;
      animation: rise 0.28s ease both;
    }
    .message.user { flex-direction: row-reverse; }
    .avatar {
      width: 31px; height: 31px;
      border-radius: 10px;
      flex: 0 0 auto;
      display: grid; place-items: center;
      font-size: 12px;
      font-weight: 700;
      margin-top: 2px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: rgba(255,255,255,0.04);
    }
    .message.assistant .avatar {
      color: #fff;
      background: linear-gradient(145deg, #6f8ff7, #9b7cf0);
      border-color: rgba(255,255,255,0.14);
      box-shadow: 0 6px 18px rgba(124, 156, 255, 0.2);
    }
    .message.user .avatar { background: rgba(94, 234, 212, 0.09); color: var(--cyan); border-color: rgba(94,234,212,0.16); }

    .bubble-wrap { max-width: min(78%, 620px); min-width: 0; }
    .message.user .bubble-wrap { display: flex; flex-direction: column; align-items: flex-end; }
    .name { font-size: 11px; color: var(--faint); margin: 0 0 5px 3px; letter-spacing: 0.04em; }
    .message.user .name { margin-right: 3px; }
    .bubble {
      padding: 11px 14px;
      border-radius: 15px;
      font-size: 14px;
      line-height: 1.68;
      word-break: break-word;
      white-space: normal;
      border: 1px solid var(--border);
      background: var(--panel-strong);
    }
    .message.assistant .bubble { border-top-left-radius: 5px; }
    .message.user .bubble {
      background: var(--user);
      border-color: rgba(124, 156, 255, 0.19);
      border-top-right-radius: 5px;
      white-space: pre-wrap;
    }
    .bubble strong { color: #fff; font-weight: 650; }
    .bubble code {
      padding: 1.5px 5px;
      border-radius: 5px;
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 0.9em;
      color: #dbeafe;
      background: rgba(148, 163, 184, 0.14);
      border: 1px solid rgba(148, 163, 184, 0.1);
    }

    .tools { display: flex; flex-direction: column; gap: 7px; margin: 0 0 8px 3px; }
    .tool-card {
      border: 1px solid rgba(124, 156, 255, 0.18);
      background: rgba(124, 156, 255, 0.055);
      border-radius: 10px;
      overflow: hidden;
      font-size: 11.5px;
    }
    .tool-card summary {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      color: #b9c6e2;
      cursor: pointer;
      user-select: none;
    }
    .tool-card summary::-webkit-details-marker { display: none; }
    .tool-card summary::after { content: "+"; margin-left: auto; color: var(--faint); font-size: 13px; }
    .tool-card[open] summary::after { content: "−"; }
    .tool-card .gear { color: var(--accent); }
    .tool-card .ok { color: var(--cyan); margin-left: auto; font-size: 10.5px; }
    .tool-card[open] .ok { display: none; }
    .tool-body { padding: 0 10px 9px; border-top: 1px solid rgba(124, 156, 255, 0.12); }
    .tool-body label { display: block; margin: 7px 0 3px; color: var(--faint); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; }
    .tool-body pre {
      margin: 0; padding: 7px 8px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.22);
      color: #cbd5e1;
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 10.5px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 160px;
      overflow: auto;
    }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 14px 16px;
    }
    .typing i {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted);
      animation: blink 1.2s infinite ease-in-out;
    }
    .typing i:nth-child(2) { animation-delay: 0.16s; }
    .typing i:nth-child(3) { animation-delay: 0.32s; }

    .composer-wrap { flex: 0 0 auto; padding: 10px 20px 17px; background: linear-gradient(180deg, transparent, rgba(8, 11, 20, 0.55) 35%); }
    .composer {
      width: min(760px, 100%);
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 9px 9px 9px 15px;
      border: 1px solid var(--border-strong);
      background: rgba(13, 18, 31, 0.94);
      border-radius: 17px;
      transition: 0.2s ease;
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.22);
    }
    .composer:focus-within { border-color: rgba(124, 156, 255, 0.55); box-shadow: 0 0 0 3px rgba(124, 156, 255, 0.08), 0 10px 34px rgba(0, 0, 0, 0.22); }
    textarea {
      flex: 1;
      min-height: 25px;
      max-height: 150px;
      resize: none;
      padding: 5px 0 3px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      line-height: 1.55;
    }
    textarea::placeholder { color: var(--faint); }
    .send {
      width: 38px; height: 38px;
      flex: 0 0 auto;
      display: grid; place-items: center;
      border: 0;
      border-radius: 11px;
      color: #0b1020;
      background: linear-gradient(145deg, #a9bcff, #8ca5ff);
      box-shadow: 0 6px 18px rgba(124, 156, 255, 0.26);
      transition: 0.18s ease;
    }
    .send:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.06); }
    .send:disabled { opacity: 0.38; cursor: not-allowed; box-shadow: none; }
    .send svg { width: 18px; height: 18px; }
    .hint {
      width: min(760px, 100%);
      margin: 8px auto 0;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 0 3px;
      color: var(--faint);
      font-size: 10.5px;
      letter-spacing: 0.02em;
    }
    .hint kbd {
      font-family: inherit;
      color: #94a3b8;
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 105px;
      transform: translate(-50%, 12px);
      opacity: 0;
      pointer-events: none;
      max-width: calc(100% - 40px);
      padding: 9px 14px;
      border-radius: 10px;
      background: #2a1520;
      border: 1px solid rgba(251, 113, 133, 0.35);
      color: #fecdd3;
      font-size: 12.5px;
      transition: 0.22s ease;
      z-index: 10;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ---- team switcher / knowledge drawer ---- */
    .team-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 32px;
      max-width: 170px;
      padding: 0 11px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.035);
      color: var(--text);
      font-size: 12px;
      transition: 0.18s ease;
    }
    .team-btn:hover { border-color: rgba(124, 156, 255, 0.4); background: rgba(124, 156, 255, 0.1); }
    .team-btn .team-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); flex: 0 0 auto; }
    .team-btn .team-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .kb-count {
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      display: inline-grid;
      place-items: center;
      background: rgba(124, 156, 255, 0.18);
      color: #c7d2fe;
      font-size: 10px;
      font-weight: 650;
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      justify-content: flex-end;
      background: rgba(3, 6, 14, 0.62);
      backdrop-filter: blur(5px);
      animation: fadeIn 0.18s ease both;
    }
    .drawer-backdrop[hidden] { display: none; }
    .drawer {
      width: min(440px, 100%);
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #0d1321;
      border-left: 1px solid var(--border-strong);
      box-shadow: -24px 0 80px rgba(0, 0, 0, 0.42);
      animation: slideIn 0.24s ease both;
    }
    .drawer-head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
      flex: 0 0 auto;
    }
    .drawer-head .titles h2 { margin: 0; font-size: 16px; font-weight: 650; }
    .drawer-head .titles p { margin-top: 4px; font-size: 11px; color: var(--muted); }
    .drawer-close {
      margin-left: auto;
      width: 32px; height: 32px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
    }
    .drawer-close:hover { color: var(--text); background: rgba(255,255,255,0.08); }
    .drawer-body { flex: 1 1 auto; overflow-y: auto; padding: 18px 20px 28px; }
    .field-label {
      display: block;
      margin: 0 0 7px;
      color: var(--faint);
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .team-row { display: flex; gap: 8px; }
    select, .text-input {
      min-width: 0;
      height: 38px;
      padding: 0 11px;
      border-radius: 10px;
      border: 1px solid var(--border-strong);
      background: #111a2b;
      color: var(--text);
      outline: 0;
      font-size: 13px;
    }
    select { flex: 1; }
    select:focus, .text-input:focus { border-color: rgba(124, 156, 255, 0.55); box-shadow: 0 0 0 3px rgba(124, 156, 255, 0.08); }
    .small-btn {
      height: 38px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.045);
      color: var(--text);
      font-size: 12px;
      white-space: nowrap;
    }
    .small-btn:hover { background: rgba(255,255,255,0.09); }
    .small-btn.primary { background: linear-gradient(145deg, #8fa8ff, #7c9cff); color: #0b1020; border-color: transparent; font-weight: 650; }
    .new-team-form { display: flex; gap: 8px; margin-top: 9px; }
    .new-team-form[hidden] { display: none; }
    .new-team-form .text-input { flex: 1; }
    .drawer-section { margin-top: 24px; }
    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      color: #c7d2e5;
      font-size: 12px;
      font-weight: 600;
    }
    .section-heading span { color: var(--faint); font-weight: 400; }

    .dropzone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: 128px;
      padding: 18px;
      border: 1px dashed rgba(124, 156, 255, 0.34);
      border-radius: 14px;
      background: rgba(124, 156, 255, 0.045);
      text-align: center;
      cursor: pointer;
      transition: 0.18s ease;
    }
    .dropzone:hover, .dropzone.dragover { background: rgba(124, 156, 255, 0.1); border-color: rgba(124, 156, 255, 0.65); }
    .dropzone .upload-icon {
      width: 34px; height: 34px;
      display: grid; place-items: center;
      border-radius: 10px;
      color: var(--accent);
      background: rgba(124, 156, 255, 0.12);
      font-size: 20px;
      margin-bottom: 3px;
    }
    .dropzone strong { font-size: 13px; font-weight: 600; }
    .dropzone span { color: var(--muted); font-size: 11px; }
    .upload-status { min-height: 18px; margin-top: 8px; color: var(--muted); font-size: 11.5px; line-height: 1.5; }
    .upload-status.success { color: var(--cyan); }
    .upload-status.error { color: var(--danger); }

    .doc-list { display: flex; flex-direction: column; gap: 8px; }
    .doc-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.025);
    }
    .doc-icon {
      width: 34px; height: 38px;
      flex: 0 0 auto;
      border-radius: 7px;
      display: grid; place-items: center;
      color: #c7d2fe;
      background: rgba(124, 156, 255, 0.13);
      border: 1px solid rgba(124, 156, 255, 0.18);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .doc-meta { min-width: 0; flex: 1; }
    .doc-meta strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; font-weight: 550; }
    .doc-meta span { display: block; margin-top: 4px; color: var(--faint); font-size: 10.5px; }
    .doc-actions { display: flex; gap: 4px; }
    .doc-actions a, .doc-actions button {
      width: 28px; height: 28px;
      display: grid; place-items: center;
      border-radius: 7px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      text-decoration: none;
    }
    .doc-actions a:hover, .doc-actions button:hover { color: var(--text); background: rgba(255,255,255,0.07); }
    .doc-actions button:hover { color: var(--danger); }
    .empty-docs {
      padding: 18px 12px;
      border: 1px dashed var(--border);
      border-radius: 11px;
      color: var(--faint);
      text-align: center;
      font-size: 11.5px;
      line-height: 1.6;
    }

    .citations { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .citation {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      max-width: 100%;
      padding: 5px 8px;
      border-radius: 7px;
      border: 1px solid rgba(94, 234, 212, 0.17);
      background: rgba(94, 234, 212, 0.055);
      color: #a7f3d0;
      font-size: 10.5px;
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .citation:hover { background: rgba(94, 234, 212, 0.11); border-color: rgba(94, 234, 212, 0.34); }
    .citation-web { color: #bfdbfe; border-color: rgba(124, 156, 255, 0.2); background: rgba(124, 156, 255, 0.06); }
    .citation-web:hover { background: rgba(124, 156, 255, 0.12); border-color: rgba(124, 156, 255, 0.38); }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideIn { from { transform: translateX(24px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-2px); } }

    @media (max-width: 640px) {
      .app { width: 100%; height: 100dvh; margin: 0; border: 0; border-radius: 0; }
      header { padding: 12px 14px; gap: 9px; }
      .titles p { display: none; }
      .titles h1 { font-size: 14px; max-width: 92px; }
      .status { display: none; }
      .header-right { gap: 7px; }
      .team-btn { max-width: 102px; padding: 0 9px; }
      .icon-btn { width: 34px; padding: 0; justify-content: center; }
      .icon-btn span { display: none; }
      .chat { padding: 20px 13px 8px; }
      .bubble-wrap { max-width: 85%; }
      .composer-wrap { padding: 8px 11px 12px; }
      .hint { display: none; }
      .welcome { padding: 20px 4px; }
      .welcome p { font-size: 12.5px; }
      .suggestions { gap: 7px; margin-top: 18px; }
      .suggestion { font-size: 11.5px; padding: 8px 10px; }
      .drawer-body { padding: 16px 15px 24px; }
      .drawer-head { padding: 16px 15px 13px; }
    }

    @media (max-width: 420px) {
      .titles { display: none; }
      .team-btn { max-width: 124px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0b1020" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z"/>
            <path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2z"/>
          </svg>
        </div>
        <div class="titles">
          <h1>Nebula Knowledge</h1>
          <p>TEAM KNOWLEDGE · LANGCHAIN v1 · FASTAPI</p>
        </div>
      </div>
      <div class="header-right">
        <button class="team-btn" id="openTeam" title="切换团队 / 管理知识库">
          <span class="team-dot"></span>
          <span class="team-name" id="teamName">默认团队</span>
        </button>
        <div class="status" id="status" title="后端状态">
          <span class="dot"></span>
          <span class="model" id="modelName">连接中</span>
        </div>
        <button class="icon-btn" id="openKb" title="团队知识库">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5V5.5z"/>
            <path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20"/>
          </svg>
          <span>知识库</span>
          <span class="kb-count" id="kbCount">0</span>
        </button>
        <button class="icon-btn" id="newChat" title="新对话">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          <span>新对话</span>
        </button>
      </div>
    </header>

    <div class="demo-banner" id="demoBanner">
      <span class="spark">✦</span>
      <span><strong>离线演示模式</strong> · 检索和引用链路是真实的，只是用本地规则模型代替了在线 LLM。</span>
    </div>

    <main class="chat" id="chat" aria-live="polite">
      <div class="inner" id="inner">
        <section class="welcome" id="welcome">
          <div class="orb" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="url(#g)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <defs>
                <linearGradient id="g" x1="4" y1="4" x2="20" y2="20">
                  <stop stop-color="#a9bcff"/><stop offset="1" stop-color="#5eead4"/>
                </linearGradient>
              </defs>
              <path d="M12 2.8l2.2 6.1 6.1 2.2-6.1 2.2-2.2 6.1-2.2-6.1L3.7 11l6.1-2.2L12 2.8z"/>
              <circle cx="18.6" cy="18.4" r="1.5"/>
            </svg>
          </div>
          <h2>问团队文档，<span>有据可查</span></h2>
          <p>上传制度、产品手册或会议纪要。我会先检索团队知识库，再基于原文回答，并附上文件名和页码。</p>
          <div class="suggestions">
            <button class="suggestion" data-prompt="报销流程是什么？"><span>▤</span>问制度流程</button>
            <button class="suggestion" data-prompt="总结一下知识库里的产品说明"><span>✦</span>总结文档</button>
            <button class="suggestion" data-prompt="现在几点了？"><span>◷</span>查询当前时间</button>
          </div>
          <button class="suggestion welcome-kb-link" id="welcomeKb" type="button"><span>＋</span>先上传一份团队文档</button>
        </section>
      </div>
    </main>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" maxlength="4000" placeholder="给 Agent 发消息…" aria-label="消息内容"></textarea>
        <button class="send" id="send" aria-label="发送" title="发送">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 3L10.5 13.5M21 3l-6.5 18-4-8.5L3 8.5 21 3z"/>
          </svg>
        </button>
      </div>
      <div class="hint">
        <span><kbd>Enter</kbd> 发送 · <kbd>Shift + Enter</kbd> 换行</span>
        <span id="meta">LangChain Agent</span>
      </div>
    </div>

    <div class="drawer-backdrop" id="kbBackdrop" hidden>
      <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="kbTitle">
        <div class="drawer-head">
          <div class="titles">
            <h2 id="kbTitle">团队知识库</h2>
            <p>文档只对当前团队可见</p>
          </div>
          <button class="drawer-close" id="closeKb" aria-label="关闭知识库">×</button>
        </div>
        <div class="drawer-body">
          <label class="field-label" for="teamSelect">当前团队</label>
          <div class="team-row">
            <select id="teamSelect" aria-label="选择团队"></select>
            <button class="small-btn" id="newTeamToggle" type="button">＋ 新建</button>
          </div>
          <div class="new-team-form" id="newTeamForm" hidden>
            <input class="text-input" id="newTeamName" maxlength="80" placeholder="输入团队名称">
            <button class="small-btn primary" id="createTeam" type="button">创建</button>
          </div>

          <div class="drawer-section">
            <div class="section-heading">上传文档 <span>PDF / DOCX / MD / TXT</span></div>
            <label class="dropzone" id="dropzone">
              <input type="file" id="fileInput" accept=".pdf,.docx,.txt,.md,.markdown" multiple hidden>
              <span class="upload-icon" aria-hidden="true">＋</span>
              <strong>点击选择，或拖拽文件到这里</strong>
              <span>单个文件不超过 10MB，重复文件会自动拦截</span>
            </label>
            <div class="upload-status" id="uploadStatus" role="status"></div>
          </div>

          <div class="drawer-section">
            <div class="section-heading">已上传 <span id="docCount">0 份</span></div>
            <div class="doc-list" id="docList"></div>
          </div>
        </div>
      </aside>
    </div>

    <div class="toast" id="toast" role="alert"></div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
